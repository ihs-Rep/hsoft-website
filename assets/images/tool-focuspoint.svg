<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="fp-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="fp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="60" fill="#0F172A"/>
  <rect x="6" y="6" width="244" height="244" rx="54" stroke="#334155" stroke-width="4"/>
  <rect x="28" y="28" width="200" height="200" rx="44" fill="url(#fp-grad)" filter="url(#fp-glow)"/>
  
  <!-- Target Crosshair / Focus Rings -->
  <circle cx="128" cy="128" r="64" stroke="#FFFFFF" stroke-width="7" stroke-opacity="0.9" fill="none"/>
  <circle cx="128" cy="128" r="38" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9" fill="none"/>
  <circle cx="128" cy="128" r="14" fill="#FFFFFF"/>
  
  <!-- Radial ticks -->
  <line x1="128" y1="48" x2="128" y2="60" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="128" y1="196" x2="128" y2="208" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="48" y1="128" x2="60" y2="128" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="196" y1="128" x2="208" y2="128" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
</svg>
