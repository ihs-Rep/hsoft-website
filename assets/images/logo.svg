<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" fill="none">
  <defs>
    <linearGradient id="topFace" x1="32" y1="24" x2="88" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="32" y1="40" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="60" y1="56" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="byteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="60" cy="55" r="42" fill="#0284C7" opacity="0.12" filter="url(#glow)"/>

  <!-- Circuit traces -->
  <path d="M 60,18 L 60,10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="60" cy="9" r="3" fill="#00F2FE"/>
  
  <path d="M 90,38 L 100,32" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="101" cy="31" r="3" fill="#00F2FE"/>

  <path d="M 30,72 L 20,78" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="19" cy="79" r="3" fill="#38BDF8"/>

  <!-- Emblem Isometric Cube -->
  <polygon points="60,24 88,40 60,56 32,40" fill="url(#topFace)"/>
  <polygon points="32,42 59,57 59,88 32,72" fill="url(#leftFace)"/>
  <polygon points="61,57 88,42 88,72 61,88" fill="url(#rightFace)"/>

  <!-- Tech Accent Lines on Top Face -->
  <polyline points="46,32 60,40 74,32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Byte Center Core Node -->
  <circle cx="60" cy="56" r="4.5" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- Brand Typography -->
  <text x="116" y="67" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5px">
    <tspan fill="#0F172A">IHS</tspan><tspan fill="url(#byteGrad)">BYTE</tspan>
  </text>
  <text x="118" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5px" fill="#64748B">
    WINDOWS UTILITIES &amp; TECH
  </text>
</svg>