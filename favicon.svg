<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favTop" x1="16" y1="10" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="favLeft" x1="16" y1="20" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="favRight" x1="32" y1="30" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <circle cx="32" cy="32" r="24" fill="#0284C7" opacity="0.3" filter="url(#favGlow)"/>

  <!-- Cube -->
  <polygon points="32,12 50,23 32,34 14,23" fill="url(#favTop)"/>
  <polygon points="14,24.5 31,34.5 31,54 14,43" fill="url(#favLeft)"/>
  <polygon points="33,34.5 50,24.5 50,43 33,54" fill="url(#favRight)"/>

  <polyline points="23,17.5 32,23 41,17.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="32" cy="34" r="2.8" fill="#FFFFFF" filter="url(#favGlow)"/>
</svg>